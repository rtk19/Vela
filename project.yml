name: Vela
options:
  bundleIdPrefix: com.refael
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    OTHER_LDFLAGS: "$(inherited) -framework AppIntents"
    DEVELOPMENT_TEAM: ""
targets:
  Vela:
    type: application
    platform: iOS
    sources:
      - Vela
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.refael.BetterStreamflix
        INFOPLIST_FILE: Vela/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Vela/Resources/Vela.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 2.0.1
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - VelaTests
  VelaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VelaTests
    dependencies:
      - target: Vela
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.refael.BetterStreamflixTests
